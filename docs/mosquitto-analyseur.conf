# Configuration Mosquitto conseillée pour le banc + l'analyseur.
# À copier (sudo) dans /etc/mosquitto/conf.d/analyseur.conf puis : sudo systemctl restart mosquitto

# Écoute locale uniquement ; ouvrir explicitement l'interface du banc si besoin.
listener 1883 127.0.0.1
allow_anonymous true

# File d'attente par client. Le banc publie en QoS 0 : si un abonné est trop lent,
# le broker jette des messages. L'ingester de l'analyseur ne bloque jamais (file interne
# illimitée, écriture en base par lots), mais on garde de la marge pour les autres abonnés.
max_queued_messages 10000
max_queued_bytes 0

# Taille max d'un message (une ligne de log) : refuse les messages aberrants.
message_size_limit 262144
